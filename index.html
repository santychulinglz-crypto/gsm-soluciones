<title>GSM Soluciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Mostrador de taller en cristal azul marino: banda de marca, indicadores, fichas de reparación y panel lateral para ticket, mensaje y proveedores. */
:root{
  /* galaxia GSM */
  --bg:#070a1f; --bg-a:rgba(120,90,255,.3); --bg-b:rgba(40,120,255,.25); --dot:rgba(255,255,255,.0);
  --surface:#12163a; --surface2:#1a1f4d; --field:#0d1130; --sheet:rgba(12,15,44,.985);
  --ink:#eaeeff; --muted:#a3acd6; --line:rgba(150,160,230,.28);
  --accent:#8ab4ff; --accent-ink:#0a0d2a; --brand:#7c8cff; --brand-2:#b78bff;
  --pri-a:#6b7cff; --pri-b:#b05cf0; --scrim:rgba(2,3,16,.66);
  --glass:rgba(24,28,76,.5); --glass-strong:rgba(40,46,110,.66); --glass-bd:rgba(170,180,255,.2);
  --glass-hi:rgba(255,255,255,.14); --glass-sh:0 8px 24px rgba(0,0,20,.45);
  --ok:#7ef0b0; --ok-bg:rgba(40,190,120,.2); --warn:#ffd36e; --warn-bg:rgba(240,180,50,.18); --bad:#ff9aa2; --bad-bg:rgba(240,70,90,.2);
  --info:#9cc4ff; --info-bg:rgba(70,130,255,.22); --idle:#b9c2e6; --idle-bg:rgba(150,160,220,.18);
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.panel-open{overflow:hidden}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 560px at 12% 8%,rgba(120,70,255,.38),transparent 65%),
    radial-gradient(800px 600px at 92% 30%,rgba(30,110,255,.30),transparent 65%),
    radial-gradient(700px 500px at 55% 105%,rgba(210,70,190,.26),transparent 65%),
    linear-gradient(170deg,#060818 0%,#0b1033 50%,#150d38 100%);
  background-attachment:fixed;
  color:var(--ink); font:14px/1.5 var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0; min-height:100%;
}
.wrap{max-width:1080px; margin:0 auto; padding-block:22px 56px; display:flex; flex-direction:column; gap:18px}
.mono{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.01em}
.muted{color:var(--muted)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* botones de cristal */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; text-align:center;
  border:1px solid var(--glass-bd); color:var(--ink); cursor:pointer;
  background:linear-gradient(180deg,var(--glass-strong),var(--glass));
  -webkit-backdrop-filter:blur(12px) saturate(1.5); backdrop-filter:blur(12px) saturate(1.5);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--glass-sh);
  padding:9px 15px; border-radius:10px; font-weight:600; line-height:1.2;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.04); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{
  color:#fff; border-color:rgba(255,255,255,.38);
  background:linear-gradient(165deg,#3f5fd0 0%,#a64fb4 62%,#d9a46c 125%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38), 0 10px 24px rgba(120,80,190,.32);
}
.btn.danger{color:var(--bad); background:linear-gradient(180deg,var(--bad-bg),var(--glass)); border-color:var(--bad)}
.btn.small{padding:6px 11px; font-size:13px; border-radius:9px}
.btn.big{padding:12px 20px; min-height:46px; font-size:15px}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; color:var(--muted)}
.btn.ghost:hover{background:var(--glass); color:var(--ink)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5; pointer-events:none}

/* banda de marca */
.top{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 20px;
  background:
    radial-gradient(420px 160px at 90% -20%, rgba(255,255,255,.20), transparent 70%),
    linear-gradient(135deg,#0f1a3c 0%,#2b3a86 55%,#6a3f9a 120%);
  color:#fff; border-radius:16px; padding:16px 20px;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 14px 34px rgba(20,38,70,.30);
}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.logo{width:62px; height:62px; border-radius:50%; background:#fff; padding:3px; flex:none; object-fit:contain; box-shadow:0 0 0 2px rgba(255,255,255,.4), 0 6px 14px rgba(0,0,0,.25)}
.brand h1{font:800 25px/1.1 var(--font-display); margin:0; letter-spacing:.02em; text-wrap:balance}
.brand p{margin:4px 0 0; color:rgba(255,255,255,.8); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:500}
.top-actions{display:flex; flex-wrap:wrap; gap:8px}
.top .btn{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.10)); border-color:rgba(255,255,255,.4); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px rgba(8,18,40,.25)}
.top .btn.primary{background:linear-gradient(180deg,#ffffff,#dfe5fa); border-color:#fff; color:#1d2a63; box-shadow:inset 0 1px 0 #fff, 0 8px 18px rgba(8,18,40,.3)}

/* indicadores */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px}
.stat{
  background:linear-gradient(180deg,var(--glass-strong),var(--glass)); border:1px solid var(--glass-bd);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--glass-sh);
  border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0;
}
.stat span.l{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600}
.stat span.v{font:800 24px/1.15 var(--font-display); font-variant-numeric:tabular-nums}
.stat.alert span.v{color:var(--bad)}

/* herramientas */
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.search{flex:1 1 260px; min-width:0}
input,textarea,select{
  font:inherit; color:var(--ink); background:var(--field); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; width:100%; min-width:0;
}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted); opacity:.8}
.search input{background:linear-gradient(180deg,var(--glass-strong),var(--glass)); border-color:var(--glass-bd); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:inset 0 1px 0 var(--glass-hi)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--glass-bd); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink);
  background:linear-gradient(180deg,var(--glass-strong),var(--glass)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.chip:hover{filter:brightness(1.05)}
.chip.on{color:#fff; border-color:rgba(255,255,255,.35); background:linear-gradient(180deg,var(--pri-a),var(--pri-b)); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 4px 12px rgba(28,50,90,.28)}
.chip .n{opacity:.7; margin-left:5px; font-variant-numeric:tabular-nums}

/* lista */
.list{display:flex; flex-direction:column; gap:10px}
.ticket{
  display:grid; width:100%; text-align:left; cursor:pointer;
  grid-template-columns:96px minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1.1fr) 96px;
  gap:6px 16px; align-items:start;
  background:linear-gradient(180deg,var(--glass-strong),var(--glass)); border:1px solid var(--glass-bd); border-radius:14px; padding:13px 16px;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--glass-sh);
  transition:transform .12s ease, border-color .12s ease;
}
.ticket:hover{border-color:var(--accent); transform:translateY(-1px)}
.ticket>span{display:flex; flex-direction:column; gap:2px; min-width:0}
.ticket strong{font-weight:600; overflow-wrap:anywhere}
.clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.t-estado .row{display:flex; flex-wrap:wrap; gap:4px}
.t-saldo{text-align:right; align-items:flex-end!important; font-variant-numeric:tabular-nums}
.pill{display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.info{color:var(--info); background:var(--info-bg)}
.pill.warn{color:var(--warn); background:var(--warn-bg)}
.pill.ok{color:var(--ok); background:var(--ok-bg)}
.pill.bad{color:var(--bad); background:var(--bad-bg)}
.pill.idle{color:var(--idle); background:var(--idle-bg)}
.empty{
  border:1px dashed var(--line); border-radius:14px; padding:36px 20px; text-align:center; color:var(--muted);
  background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.empty strong{display:block; color:var(--ink); font:700 16px var(--font-display); margin-bottom:4px}
.note{background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:10px 14px; font-weight:500}
.foot{color:var(--muted); font-size:12.5px}

@media (max-width:760px){
  .ticket{grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"folio saldo" "cliente cliente" "equipo equipo" "estado estado"}
  .t-folio{grid-area:folio; flex-direction:row!important; gap:10px!important; align-items:baseline}
  .t-cliente{grid-area:cliente}
  .t-equipo{grid-area:equipo}
  .t-estado{grid-area:estado}
  .t-saldo{grid-area:saldo}
}

/* acceso y usuarios */
.who{color:rgba(255,255,255,.88); font-size:13px; font-weight:500; margin-right:4px; align-self:center}
.loc{flex:0 1 210px; min-width:150px}
.login{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto}
.login-card{
  width:min(420px,100%); display:flex; flex-direction:column; gap:14px; text-align:left;
  background:linear-gradient(180deg,var(--glass-strong),var(--glass)); border:1px solid var(--glass-bd);
  -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:inset 0 1px 0 var(--glass-hi), 0 24px 60px rgba(14,28,56,.28); border-radius:22px; padding:28px 26px;
}
.login-card .cab{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.login-card .lg-logo{width:84px; height:84px; border-radius:50%; background:#fff; padding:4px; box-shadow:0 0 0 2px rgba(255,255,255,.7), 0 8px 18px rgba(14,28,56,.25)}
.login-card h1{font:800 22px/1.15 var(--font-display); margin:6px 0 0}
.login-card h2{font:700 15px/1.3 var(--font-display); margin:0; color:var(--muted); font-weight:600}
.login-card .link{background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:12.5px; padding:4px; align-self:center}
/* acceso: panel de marca + formulario */
.login-card{
  width:min(920px,100%); display:block; padding:0; gap:0; overflow:hidden; border-radius:28px;
  background:var(--sheet); border:1px solid var(--glass-bd);
  box-shadow:0 30px 80px rgba(12,26,52,.38), inset 0 1px 0 var(--glass-hi);
}
.lg-wrap{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); min-height:520px}
.lg-brand{
  position:relative; overflow:hidden; color:#fff; padding:34px 30px; display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  background:
    radial-gradient(420px 300px at 110% -10%, rgba(255,255,255,.22), transparent 65%),
    radial-gradient(360px 280px at -20% 110%, rgba(120,170,235,.35), transparent 65%),
    linear-gradient(155deg,var(--brand) 0%,var(--brand-2) 100%);
}
.lg-brand::before,.lg-brand::after{content:""; position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.16); pointer-events:none}
.lg-brand::before{width:340px; height:340px; right:-120px; top:-110px}
.lg-brand::after{width:260px; height:260px; left:-90px; bottom:-90px}
.lg-orb{width:116px; height:116px; border-radius:50%; background:#fff; padding:5px; box-shadow:0 0 0 3px rgba(255,255,255,.35), 0 14px 30px rgba(6,16,36,.4); position:relative; z-index:1}
.lg-orb img{width:100%; height:100%; border-radius:50%; object-fit:contain; display:block}
.lg-name{font:800 28px/1.1 var(--font-display); letter-spacing:.02em; margin-top:14px; position:relative; z-index:1}
.lg-tag{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.8); position:relative; z-index:1}
.lg-time{margin-top:auto; padding-top:26px; display:flex; align-items:center; gap:14px; position:relative; z-index:1}
.lg-time svg{width:44px; height:44px; flex:none}
.lg-hora{font:800 30px/1 var(--font-display); font-variant-numeric:tabular-nums}
.lg-fecha{font-size:13px; color:rgba(255,255,255,.85); margin-top:4px}
.lg-form{padding:38px 36px; display:flex; flex-direction:column; justify-content:center; gap:14px; min-width:0}
.lg-head h2{font:800 30px/1.15 var(--font-display); margin:0; color:var(--ink); text-wrap:balance}
.lg-head p{margin:6px 0 0; color:var(--muted); font-size:15px}
.lg-form form{display:flex; flex-direction:column; gap:14px}
.lg-form select,.lg-form input{padding:13px 14px; border-radius:12px; font-size:15px}
.pinbox{position:relative}
.pinbox input{padding-right:84px}
.pinbox input:not(:placeholder-shown){letter-spacing:.12em}
.pinbox button{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:var(--accent); font-weight:600; font-size:13px; cursor:pointer; padding:6px 8px; border-radius:8px}
.pinbox button:hover{background:var(--surface2)}
.lg-form .link{background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; padding:4px; align-self:flex-start}
@media (max-width:760px){
  .lg-wrap{grid-template-columns:1fr; min-height:0}
  .lg-brand{padding:22px 22px 18px; flex-direction:row; flex-wrap:wrap; align-items:center; gap:4px 14px}
  .lg-orb{width:68px; height:68px; padding:3px}
  .lg-name{font-size:21px; margin-top:0}
  .lg-time{margin-top:0; padding-top:10px; flex:1 1 100%}
  .lg-hora{font-size:22px}
  .lg-time svg{width:32px; height:32px}
  .lg-form{padding:26px 22px 28px}
  .lg-head h2{font-size:25px}
}
/* ===== acceso v2: pantalla oscura a todo lo ancho + paisaje nocturno ===== */
.login{padding:0; align-items:stretch; background:#05070d; --ink:#e8ecf5; --muted:#9aa6bd; color:var(--ink); color-scheme:dark}
.login-card{width:100%; max-width:none; min-height:100%; border:0; border-radius:0; background:transparent; box-shadow:none; overflow:visible}
.lg-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr); min-height:100vh; min-height:100dvh}
.lg-form{padding:clamp(28px,6vh,64px) clamp(24px,7vw,110px); justify-content:center; gap:18px; max-width:640px; width:100%; justify-self:end; position:relative; z-index:2}
.lg-mark{display:flex; align-items:center; gap:12px; margin-bottom:clamp(8px,4vh,40px)}
.lg-mark img{width:52px; height:52px; border-radius:50%; background:#fff; padding:2px; object-fit:contain; box-shadow:0 0 0 2px rgba(143,176,224,.45), 0 8px 22px rgba(0,0,0,.5)}
.lg-mark b{font:800 17px/1.1 var(--font-display); letter-spacing:.03em}
.lg-mark small{display:block; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); font-weight:500; margin-top:3px}
.lg-head h2{font-size:clamp(34px,4.4vw,52px); line-height:1.05; letter-spacing:-.01em; color:#e3e6ee}
.lg-head p{color:var(--muted); font-size:16px; margin-top:10px}
.lg-form label{color:#c9d1e2; font-size:13px; font-weight:500}
.lg-form select,.lg-form input{
  color:#eef1f8; padding:15px 18px; border-radius:16px; font-size:16px; border:1.5px solid transparent;
  background:linear-gradient(#0f1118,#0f1118) padding-box, linear-gradient(135deg,#4a63e0,#b457b8 55%,#f0c27a) border-box;
  transition:box-shadow .2s;
}
.lg-form select:focus,.lg-form input:focus{outline:none; box-shadow:0 0 0 4px rgba(120,140,255,.22)}
.lg-form select option,.lg-form select optgroup{background:#10131c; color:#eef1f8}
.lg-form input::placeholder{color:#5d6780}
.pinbox button{color:#f0c27a}
.pinbox button:hover{background:rgba(255,255,255,.07)}
.lg-form .btn.primary{
  border:0; border-radius:16px; padding:15px; font:700 19px/1 var(--font-display); color:#fff; margin-top:6px; cursor:pointer;
  background:linear-gradient(165deg,#3f5fd0 0%,#a64fb4 58%,#e3b072 120%);
  box-shadow:0 14px 30px rgba(120,80,190,.35), inset 0 1px 0 rgba(255,255,255,.35); text-shadow:0 1px 2px rgba(0,0,0,.3);
  transition:transform .15s, filter .15s;
}
.lg-form .btn.primary:hover{filter:brightness(1.08); transform:translateY(-1px)}
.lg-form .link{color:#d7ddec; align-self:flex-end; font-size:14px}
.lg-form .err{color:#ff9aa6}
.lg-foot{margin-top:auto; padding-top:20px; font-size:12.5px; color:#6f7a93}
.lg-brand{padding:0; min-height:100%; background:#070a14; align-items:stretch; border-radius:0}
.lg-brand::before,.lg-brand::after{display:none}
.lg-scene{position:absolute; inset:0; width:100%; height:100%; display:block}
.lg-brand::after{display:block; border:0; border-radius:0; width:auto; height:auto; left:0; top:0; right:auto; bottom:0; width:38%; background:linear-gradient(90deg,#05070d,rgba(5,7,13,0))}
.lg-time{position:absolute; right:clamp(18px,3vw,40px); top:clamp(18px,3vh,36px); margin:0; padding:10px 16px; border-radius:16px; background:rgba(8,12,24,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14); z-index:2}
.lg-time svg{width:34px; height:34px}
.lg-hora{font-size:24px}
@media (max-width:860px){
  .lg-wrap{grid-template-columns:1fr; min-height:0}
  .lg-brand{order:-1; height:190px; min-height:190px}
  .lg-brand::after{width:auto; left:0; right:0; top:auto; height:55%; background:linear-gradient(0deg,#05070d,rgba(5,7,13,0))}
  .lg-form{max-width:none; padding:18px 22px 30px; justify-self:stretch}
  .lg-mark{margin-bottom:4px}
  .lg-head h2{font-size:32px}
  .lg-time{padding:6px 12px; right:12px; top:12px}
  .lg-hora{font-size:18px} .lg-fecha{display:none}
  .lg-time svg{width:26px; height:26px}
}
/* panel técnico */
.tec-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px}
.tec-grid .k{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0}
.tec-grid .k small{display:block; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tec-grid .k b{font:800 17px/1.25 var(--font-display); font-variant-numeric:tabular-nums}
.tec-grid .k.pago{border-color:#7a62d6; background:linear-gradient(180deg,rgba(122,98,214,.22),rgba(122,98,214,.08))}
.tec-grid .k input{padding:6px 8px; font-size:14px; margin-top:2px}
.tec-fila{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 12px}
.tec-fila .t{min-width:0}
.tec-mini{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
/* menú lateral */
.app{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px))); margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.side{position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:18px 12px;
  background:linear-gradient(180deg,#0a0e1c,#070a14); border-right:1px solid rgba(255,255,255,.08)}
.side-brand{display:flex; align-items:center; gap:11px; padding:2px 6px 14px; border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .logo{width:46px; height:46px}
.side-brand h1{font:800 16px/1.15 var(--font-display); margin:0; color:#fff; letter-spacing:.02em}

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoy(){return ymd(new Date())}
function parse(s){if(!s)return null;var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDias(s,n){var d=parse(s);if(!d)return '';d.setDate(d.getDate()+n);return ymd(d)}
function diffDias(a,b){var x=parse(a),y=parse(b);if(!x||!y)return null;return Math.round((y-x)/86400000)}
function fmtFecha(s){
  var d=parse(s);if(!d)return '—';
  var o={day:'numeric',month:'short'};
  if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString('es-MX',o);
}
function fmtHora(iso){
  var d=new Date(iso);if(isNaN(d))return '';
  return d.toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}
function mx(n){return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:2})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function esAbierto(e){return ABIERTOS.indexOf(e.estatus)>-1}
function esAtrasado(e){return esAbierto(e)&&!!e.fechaPrometida&&e.fechaPrometida<hoy()}
function saldo(e){return e.pagado?0:Math.max(0,(+e.costo||0)-(+e.anticipo||0))}
function ganancia(e){return (+e.costo||0)-(+e.costoRefaccion||0)}
function nombreEq(e){return (e.marca+' '+e.modelo).trim()}
function find(id){for(var i=0;i<equipos.length;i++)if(equipos[i].id===id)return equipos[i];return null}
function vis(){return localFiltro==='todos'?equipos:equipos.filter(function(e){return e.localId===localFiltro;});}
function nomLocal(e){var l=findLocal(e.localId);return l?l.nombre:(e.localNombre||'');}
function findProv(id){for(var i=0;i<provs.length;i++)if(provs[i].id===id)return provs[i];return null}

/* ---------- WhatsApp ---------- */
function telWA(t){
  var d=String(t||'').replace(/\D/g,'');
  if(d.length===10)return '52'+d;
  if(d.length>=11&&d.length<=13)return d;
  return '';
}
function linkWA(tel,texto){
  var n=telWA(tel);
  return n?'https://wa.me/'+n+'?text='+encodeURIComponent(texto):'';
}

function saludoHora(){var h=new Date().getHours();return h<12?'Buenos días':(h<19?'Buenas tardes':'Buenas noches');}

function linkConsulta(e){
  var l=localDe(e),tel=l?telWA(l.telefono):'';if(!tel)return '';

}
function qrMatriz(texto){
  try{if(typeof qrcode!=='function')return null;var q=qrcode(0,'M');q.addData(texto);q.make();return q;}catch(x){return null;}
}
function qrSVG(texto){
  var q=qrMatriz(texto);if(!q)return '';
  var n=q.getModuleCount(),d='';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+1)+' '+(r+1)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+2)+' '+(n+2)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

    subscribe:function(f){cb=f;emit();return function(){cb=null;};},

        if(JSON.stringify(docs[k])!==JSON.stringify(r.data)){docs[k]=r.data;cambio=true;}
        if(!max||r.actualizado>max)max=r.actualizado;
      });
      if(ids)Object.keys(docs).forEach(function(k){if(!ids[k]){delete docs[k];cambio=true;}});
      last=max;persist();
      if(cambio){listo=true;emit();}
    }).then(function(){enPoll=null;},function(e){enPoll=null;subs.forEach(function(s){if(s.err)s.err(e);});});
    return enPoll;
  }
  function arrancarPoll(){
    if(timer)return;
    timer=setInterval(function(){if(!document.hidden)poll();},15000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
    window.addEventListener('online',poll);
  }
  var chains={};
  function enCola(k,fn){var p=(chains[k]||Promise.resolve()).then(fn,fn);chains[k]=p.catch(function(){});return p;}
  return {
    store:function(col){
      return {
        local:false,sb:true,
        libre:function(id){
          if(docs[col+'/'+id])return Promise.resolve(false);
          return api('GET','docs?coleccion=eq.'+encodeURIComponent(col)+'&id=eq.'+encodeURIComponent(id)+'&select=id').then(function(r){return !(r&&r.length);});
        },
        subscribe:function(f,err){
          var o={col:col,f:f,err:err};subs.push(o);
          if(listo)setTimeout(function(){f(lista(col));},0);
          arrancarPoll();poll();
          return function(){subs=subs.filter(function(x){return x!==o;});};
        },
        save:function(d){return enCola(col+'/'+d.id,function(){
          return api('POST','docs?on_conflict=coleccion,id',{coleccion:col,id:String(d.id),data:d},{'Prefer':'resolution=merge-duplicates,return=minimal'}).then(function(){docs[col+'/'+d.id]=d;ver++;persist();emit();});
        });},
        remove:function(id){return enCola(col+'/'+id,function(){
          return api('DELETE','docs?coleccion=eq.'+encodeURIComponent(col)+'&id=eq.'+encodeURIComponent(id)).then(function(){delete docs[col+'/'+id];ver++;persist();emit();});
        });}
      };
    }
  };
}

/* ---------- ticket PDF ---------- */
function dibujaTicket(doc,x0,w,e,copia){
  var m=4,cx=x0+w/2,xl=x0+m,xr=x0+w-m,cw=w-2*m,y=5;

    doc.setFont('helvetica',style||'normal');doc.setFontSize(size);doc.setTextColor(gris==null?20:gris);
    var lh=size*0.43,lines=doc.splitTextToSize(String(t),cw);

  }
  function linea(){y+=1.5;doc.setDrawColor(150);doc.setLineDashPattern([0.8,0.8],0);doc.line(xl,y,xr,y);doc.setLineDashPattern([],0);y+=2.5;}
  function campo(l,v){if(!v)return;txt(String(l).toUpperCase(),6.5,'bold','left',110);txt(v,9,'normal');y+=1.2;}
  function fila(l,v,negrita){
    var size=negrita?11:9;y+=size*0.43;

    doc.text(l,xl,y);doc.text(v,xr,y,{align:'right'});y+=0.8;
  }
  if(copia){txt(copia.toUpperCase(),7,'bold','center',110);y+=1;}
  try{doc.addImage(LOGO,'JPEG',cx-11,y,22,22);y+=24;}catch(err){}
  txt(NEGOCIO.toUpperCase(),14,'bold','center');
  txt(LEMA,8,'normal','center',90);
  (function(){var l=localDe(e);if(!l)return;if(l.direccion)txt(l.direccion,7.5,'normal','center',90);if(l.telefono)txt('Tel. '+l.telefono,7.5,'normal','center',90);if(l.horario)txt(l.horario,7.5,'normal','center',90);})();
  linea();
  txt('ORDEN DE REPARACIÓN',9,'bold','center');
  txt(e.id,15,'bold','center');
  txt(fmtFecha(e.fechaIngreso)+(e.creado?' · '+new Date(e.creado).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):''),8,'normal','center',90);
  linea();
  campo('Sucursal',nomLocal(e));
  campo('Atendió',e.cajeroNombre);
  campo('Cliente',e.cliente);
  campo('Teléfono',e.telefono);
  campo('Referencia',[e.refNombre,e.refTelefono].filter(Boolean).join(' · '));
  campo('Equipo',nombreEq(e));
  campo('IMEI / serie',e.imei);
  if(copia==='Copia taller'&&e.bloqueo)campo('Bloqueo',e.bloqueo);
  campo('Falla reportada',e.falla);
  campo('Accesorios que deja',(e.accesorios||[]).join(', ')||'Ninguno');
  campo('Estado físico',e.estadoFisico||'Sin observaciones');
  campo('Servicio',e.servicio||'Por definir');
  campo('Entrega estimada',e.fechaPrometida?fmtFecha(e.fechaPrometida):'Por confirmar');
  linea();
  fila('Costo',mx(e.costo));
  fila('Anticipo',mx(e.anticipo));
  fila('SALDO',mx(saldo(e)),true);
  linea();
  campo('Garantía',+e.garantiaDias>0?e.garantiaDias+' días desde la entrega':'Sin garantía');
  TERMINOS.forEach(function(t){txt('· '+t,7,'normal','left',90);});
  (function(){

var tecSel='', tecPer='mes';
var EST_TRABAJO=['En diagnóstico','Esperando refacción','En reparación','Listo para entrega'];
function esTecnico(){return !!sesion&&sesion.rol==='tecnico';}
function puedeTecnico(){return esAdmin()||esTecnico();}
function tecnicos(){return usuarios.filter(function(u){return u.rol==='tecnico'&&u.activo!==false;});}
function pctDe(e){
  if(e.tecnicoPct!=null&&e.tecnicoPct!=='')return +e.tecnicoPct;
  var u=findUser(e.tecnicoId);return(u&&u.comision!=null&&u.comision!=='')?+u.comision:30;
}
function pagoTec(e){return Math.max(0,ganancia(e))*pctDe(e)/100;}
function terminada(e){return e.estatus==='Listo para entrega'||e.estatus==='Entregado';}
function fechaTerm(e){return String(e.fechaListo||e.fechaEntrega||e.fechaIngreso||'');}
function enPeriodo(e){
  if(tecPer==='todo')return true;
  var f=fechaTerm(e).slice(0,7),m=hoy().slice(0,7);
  if(tecPer==='mes')return f===m;
  var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return f===ymd(d).slice(0,7);
}
function asignarTec(n,u){n.tecnicoId=u.id;n.tecnicoNombre=u.nombre;n.tecnicoPct=(u.comision!=null&&u.comision!=='')?+u.comision:30;}
function cambiarEstatus(id,est,extra,silencio){
  var e=find(id);if(!e||(e.estatus===est&&!extra))return;
  var n=Object.assign({},e),cambia=e.estatus!==est;
  if(cambia){
    n.estatus=est;
    n.historial=(e.historial||[]).concat([{estatus:est,en:new Date().toISOString(),por:sesion?sesion.nombre:''}]);
    n.fechaEntrega=SALIDAS.indexOf(est)>-1?hoy():'';
    if(est!=='Entregado'&&e.estatus==='Entregado')n.pagado=false;
    if(est==='Listo para entrega'||(est==='Entregado'&&!e.fechaListo))n.fechaListo=hoy();
    else if(est!=='Entregado'&&est!=='Listo para entrega')n.fechaListo='';
    if(esTecnico()&&!e.tecnicoId&&EST_TRABAJO.indexOf(est)>-1)asignarTec(n,sesion);
  }
  if(extra)Object.assign(n,extra);
  recien=false;
  guardar(n).then(function(){if(!silencio)toast(cambia?'Estatus: '+est+'. El mensaje para el cliente ya está listo.':'Equipo asignado');}).catch(function(){});
}
function tomarEquipo(id){
  var e=find(id);if(!e)return;
  var u=esTecnico()?sesion:findUser(tecSel);
  if(!u||u.rol!=='tecnico'){toast('Elige primero un técnico arriba');return;}
  var n={};asignarTec(n,u);
  cambiarEstatus(id,'En reparación',n);
}
function fibraSVG(vw,vh,n,seed,vertical,clase){
  var sd=seed;function r(){sd=(sd*16807)%2147483647;return sd/2147483647;}
  var cols=['#ffffff','#9df1ff','#ffffff','#c9f7ff','#6fe6ff'],hilos='',luces='';
  for(var i=0;i<n;i++){
    var a=vertical?[r()*vw,-20]:[-20,r()*vh];
    var b=vertical?[r()*vw,vh+20]:[vw+20,r()*vh];
    var c1=vertical?[r()*vw,vh*(.25+r()*.2)]:[vw*(.25+r()*.2),r()*vh];
    var c2=vertical?[r()*vw,vh*(.6+r()*.2)]:[vw*(.6+r()*.2),r()*vh];
    var d='M'+a[0].toFixed(0)+' '+a[1].toFixed(0)+' C'+c1[0].toFixed(0)+' '+c1[1].toFixed(0)+','+c2[0].toFixed(0)+' '+c2[1].toFixed(0)+','+b[0].toFixed(0)+' '+b[1].toFixed(0);
    hilos+='<path class="fb-hilo" pathLength="1000" d="'+d+'"/>';
    luces+='<path class="fb-luz" pathLength="1000" d="'+d+'" stroke="'+cols[i%cols.length]+'" style="--d:'+(7+r()*8).toFixed(1)+'s;--w:-'+(r()*12).toFixed(1)+'s"/>';
  }
  return '<svg class="fibra '+(clase||'')+'" viewBox="0 0 '+vw+' '+vh+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="fb-g'+(clase||'')+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#bff3ff" stop-opacity=".2"/></linearGradient></defs>'+hilos.replace(/url\(#fb-g\)/g,'')+luces+'</svg>';
}
var vista='dash';
var VISTAS={dash:['vDash','navDash','Dashboard'],tec:['vTec','btnTec','Panel técnico'],gar:['vGar','navGar','Garantías'],ped:['vPed','navPed','Piezas y pedidos']};
function aplicarVista(){
  if(!sesion||(vista==='tec'&&!puedeTecnico()))vista='dash';
  Object.keys(VISTAS).forEach(function(k){var el=$('#'+VISTAS[k][0]),nv=$('#'+VISTAS[k][1]);if(el)el.hidden=k!==vista;if(nv)nv.classList.toggle('on',k===vista);});
  var t=$('#vistaTitulo');if(t)t.textContent=VISTAS[vista][2];
  if(vista==='dash'){var sb=$('#vistaSub');if(sb)sb.textContent=sesion?'Bienvenido, '+sesion.nombre:'';}
}
function setVista(v){vista=VISTAS[v]?v:'dash';aplicarVista();if(vista==='tec'){if(esTecnico())tecSel=sesion.id;else if(!tecSel)tecSel='todos';renderTecnico();}if(vista==='gar')renderGarantias();if(vista==='ped')renderPiezas();window.scrollTo(0,0);}
function abrirTecnico(){if(!puedeTecnico())return;setVista('tec');}
function renderTecnico(){
  var sh=$('#vTec');
  var admin=esAdmin(),tecs=tecnicos();
  var sel=esTecnico()?sesion.id:tecSel;
  if(admin&&sel!=='todos'&&!findUser(sel))sel=tecSel='todos';
  var propia=function(e){return sel==='todos'?!!e.tecnicoId:e.tecnicoId===sel;};
  var libres=equipos.filter(function(e){return !e.tecnicoId&&esAbierto(e)&&e.estatus!=='Listo para entrega';}).sort(function(a,b){return String(a.fechaIngreso).localeCompare(String(b.fechaIngreso));});
  var proceso=equipos.filter(function(e){return propia(e)&&esAbierto(e)&&e.estatus!=='Listo para entrega';});
  var hechas=equipos.filter(function(e){return propia(e)&&terminada(e)&&enPeriodo(e);}).sort(function(a,b){return fechaTerm(b).localeCompare(fechaTerm(a));});
  var util=0,pago=0,pend=0,est=0;
  hechas.forEach(function(e){util+=Math.max(0,ganancia(e));pago+=pagoTec(e);if(!e.pagoTecnico)pend+=pagoTec(e);});
  proceso.forEach(function(e){est+=pagoTec(e)||Math.max(0,ganancia(e))*30/100;});
  var nom=sel==='todos'?'Todos los técnicos':(findUser(sel)||{}).nombre;
  var pc=sel!=='todos'&&findUser(sel)&&findUser(sel).comision!=null&&findUser(sel).comision!==''?+findUser(sel).comision:30;
  var h='';
  $('#vistaSub').textContent=(nom||'')+' · pago: '+(sel==='todos'?'30% (o lo definido a cada técnico)':pc+'% de la utilidad')+' de cada reparación.';
  if(admin){
    h+='<div class="campo"><label for="tec-sel">Técnico</label><select id="tec-sel"><option value="todos"'+(sel==='todos'?' selected':'')+'>Todos los técnicos</option>'+
      tecs.map(function(u){return '<option value="'+esc(u.id)+'"'+(u.id===sel?' selected':'')+'>'+esc(u.nombre)+'</option>';}).join('')+'</select>'+
      (tecs.length?'':'<span class="hint">Aún no hay técnicos. Créalos en Administrar → Nuevo usuario → Rol «Técnico».</span>')+'</div>';
  }
  h+='<div class="chips" role="group" aria-label="Periodo" style="margin:10px 0">'+[['mes','Este mes'],['ant','Mes anterior'],['todo','Todo']].map(function(p){return '<button type="button" class="chip'+(tecPer===p[0]?' on':'')+'" data-action="tec-per" data-val="'+p[0]+'" aria-pressed="'+(tecPer===p[0])+'">'+p[1]+'</button>';}).join('')+'</div>';
  h+='<div class="tec-grid"><div class="k"><small>Reparaciones</small><b>'+hechas.length+'</b></div><div class="k"><small>Utilidad generada</small><b>'+mx(util)+'</b></div><div class="k pago"><small>Pago al técnico</small><b>'+mx(pago)+'</b></div><div class="k"><small>Por pagar</small><b>'+mx(pend)+'</b></div><div class="k"><small>En proceso (estimado)</small><b>'+mx(est)+'</b></div></div>';
  h+='<p class="hint">Utilidad = lo que se cobra al cliente − el costo de la refacción. El pago cuenta cuando el equipo queda «Listo para entrega» o «Entregado».</p>';

  /* en proceso */
  h+='<div class="sec"><h3>'+(esTecnico()?'Mis equipos en proceso':'Equipos en proceso')+' ('+proceso.length+')</h3>';
  if(!proceso.length)h+='<p class="muted">No hay equipos en proceso. Toma uno de la lista de abajo.</p>';
  h+=proceso.map(function(e){
    var ut=Math.max(0,ganancia(e)),py=pagoTec(e);
    var chips=EST_TRABAJO.map(function(st){return '<button type="button" class="chip'+(st===e.estatus?' on':'')+'" data-action="tec-est" data-id="'+esc(e.id)+'" data-val="'+esc(st)+'" aria-pressed="'+(st===e.estatus)+'">'+esc(st)+'</button>';}).join('');
    return '<div class="prov" style="margin-bottom:10px"><div class="tec-fila"><div class="t"><strong>'+esc(e.id)+' · '+esc(nombreEq(e))+'</strong><div class="muted">'+esc(e.falla||'')+' · '+esc(e.cliente)+(sel==='todos'&&e.tecnicoNombre?' · Técnico: '+esc(e.tecnicoNombre):'')+'</div></div><span class="pill info">'+esc(e.estatus)+'</span></div>'+
      '<div class="chips">'+chips+'</div>'+
      '<div class="tec-grid"><div class="k"><small>Cobro al cliente</small><b>'+mx(e.costo)+'</b></div>'+
      '<div class="k"><small>Costo refacción</small><input type="number" inputmode="decimal" min="0" step="any" data-tecref="'+esc(e.id)+'" value="'+(+e.costoRefaccion||'')+'" placeholder="0" aria-label="Costo de la refacción de '+esc(e.id)+'"></div>'+
      '<div class="k"><small>Utilidad</small><b>'+mx(ut)+'</b></div>'+
      '<div class="k pago"><small>Pago ('+pctDe(e)+'%)</small><b>'+mx(py)+'</b></div></div>'+
      (+e.costo>0?'':'<p class="hint err">Falta el cobro al cliente. Se captura al editar el equipo.</p>')+
      '<div class="actions"><button type="button" class="btn small" data-action="tec-abrir" data-id="'+esc(e.id)+'">Ver equipo</button></div></div>';
  }).join('')+'</div>';

  /* disponibles */
  h+='<div class="sec"><h3>Equipos por tomar ('+libres.length+')</h3>';
  if(!libres.length)h+='<p class="muted">No hay equipos sin técnico.</p>';
  h+=libres.map(function(e){
    return '<div class="prov" style="margin-bottom:8px"><div class="tec-fila"><div class="t"><strong>'+esc(e.id)+' · '+esc(nombreEq(e))+'</strong><div class="muted">'+esc(e.falla||'')+' · '+esc(nomLocal(e))+'</div></div>'+
      '<span class="tec-mini"><span class="pill idle">'+esc(e.estatus)+'</span><button type="button" class="btn small primary" data-action="tec-tomar" data-id="'+esc(e.id)+'">Tomar y reparar</button></span></div></div>';
  }).join('')+'</div>';

  /* terminadas */
  h+='<div class="sec"><h3>Reparaciones terminadas ('+hechas.length+')</h3>';
  if(!hechas.length)h+='<p class="muted">Todavía no hay reparaciones terminadas en este periodo.</p>';
  h+=hechas.map(function(e){
    return '<div class="prov" style="margin-bottom:8px"><div class="tec-fila"><div class="t"><strong>'+esc(e.id)+' · '+esc(nombreEq(e))+'</strong><div class="muted">'+(sel==='todos'&&e.tecnicoNombre?esc(e.tecnicoNombre)+' · ':'')+'Cobro '+mx(e.costo)+' − refacción '+mx(e.costoRefaccion)+' = utilidad '+mx(Math.max(0,ganancia(e)))+'</div></div>'+
      '<span class="tec-mini"><strong>'+mx(pagoTec(e))+'</strong><span class="pill '+(e.pagoTecnico?'ok':'warn')+'">'+(e.pagoTecnico?'Pagado':'Por pagar')+'</span>'+
      (admin?'<button type="button" class="btn small" data-action="tec-pago" data-id="'+esc(e.id)+'">'+(e.pagoTecnico?'Deshacer pago':'Marcar pagado')+'</button>':'')+'</span></div></div>';
  }).join('')+'</div>';
  sh.innerHTML=h;
}
function copiar(texto,msg){
  function ok(){toast(msg);}
  function fallo(){
    var box=$('#copiaManual');
    if(box){box.hidden=false;var ta=box.querySelector('textarea');ta.value=texto;ta.focus();ta.select();}
    toast('Selecciona el texto y cópialo');
  }
  try{navigator.clipboard.writeText(texto).then(ok,fallo);}catch(e){fallo();}
}
function csvCelda(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportar(){
  if(!descargas){toast('La descarga no está disponible aquí');return;}
  var cols=[['Folio','id'],['Fecha ingreso','fechaIngreso'],['Local','_local'],['Cajero','cajeroNombre'],['Cliente','cliente'],['Teléfono','telefono'],['Persona de referencia','refNombre'],['Teléfono de referencia','refTelefono'],['Marca','marca'],['Modelo','modelo'],['IMEI / serie','imei'],['Falla','falla'],['Servicio','servicio'],['Costo','costo'],['Anticipo','anticipo'],['Refacción','refaccion'],['Proveedor','_prov'],['Costo refacción','costoRefaccion'],['Técnico','tecnicoNombre'],['Pago técnico','_pagotec'],['Garantía de','garantiaDe'],['Estatus','estatus'],['Fecha prometida','fechaPrometida'],['Fecha salida','fechaEntrega'],['Garantía (días)','garantiaDias'],['Notas','notas']];
  var filas=equipos.slice().sort(function(a,b){return a.id.localeCompare(b.id);}).map(function(e){
    var x=Object.assign({},e),p=findProv(e.proveedorId);x._prov=p?p.nombre:'';x._pagotec=(e.tecnicoId&&terminada(e))?pagoTec(e):'';x._local=nomLocal(e);
    return cols.map(function(c){return csvCelda(x[c[1]]);}).join(',');
  });
  var csv='﻿'+cols.map(function(c){return csvCelda(c[0]);}).join(',')+'\n'+filas.join('\n');
  descargas.save({filename:'equipos-gsm-soluciones-'+hoy()+'.csv',data:csv}).then(function(){toast('Archivo guardado');}).catch(function(e){if(e&&e.code==='declined')return;toast('No se pudo guardar el archivo');});
}

document.addEventListener('click',function(ev){

  var b=ev.target.closest('[data-action]');if(!b)return;
  var a=b.getAttribute('data-action');
  if(a==='nuevo')abrirForm(null);
  else if(a==='abrir')abrirDetalle(b.getAttribute('data-id'));
  else if(a==='cerrar')cerrarPanel();
  else if(a==='cancelar-form')cancelarForm();
  else if(a==='descartar')salirForm();

function findUser(id){for(var i=0;i<usuarios.length;i++)if(usuarios[i].id===id)return usuarios[i];return null;}
function normCod(v){return String(v||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').slice(0,20);}
function findByCodigo(v){
  var c=normCod(v);if(!c)return null;
  for(var i=0;i<usuarios.length;i++)if(normCod(usuarios[i].codigo)===c)return usuarios[i];
  var n=norm(String(v||'')).trim();
  for(var j=0;j<usuarios.length;j++)if(!usuarios[j].codigo&&norm(usuarios[j].nombre).trim()===n)return usuarios[j];
  return null;
}

function localesOrd(){return locales.slice().sort(function(a,b){return (a.orden||0)-(b.orden||0);});}

function pinOk(p){return typeof p==='string'&&p.length>=4&&p.length<=20;}
function pinHash(id,pin){
  var txt='gsm:'+id+':'+pin;
  try{
    if(window.crypto&&window.crypto.subtle&&window.TextEncoder){
      return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
      });
    }
  }catch(e){}
  var h=5381;for(var i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))|0;
  return Promise.resolve('x'+(h>>>0).toString(16));
}

    '<div class="form-actions"><button type="submit" class="btn primary big">'+(id?'Guardar cambios':'Crear sucursal')+'</button><button type="button" class="btn ghost big" data-action="loc-cancel">Cancelar</button></div></form>';
  $('#sheet').scrollTop=0;
  setTimeout(function(){var c=$('#l-nombre');if(c)c.focus();},50);
}
function guardarLoc(){
  var er=$('#lError');function fallo(m){er.hidden=false;er.textContent=m;}
  var nombre=$('#l-nombre').value.trim(),cod=$('#l-codigo').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);
  var prev=selId?findLocal(selId):null;
  if(!nombre){fallo('Falta el nombre de la sucursal.');return;}
  if(!cod){fallo('Falta la letra del folio (1 a 3 letras).');return;}
  if(locales.some(function(x){return x.id!==selId&&x.codigo===cod;})){fallo('Otra sucursal ya usa esa letra de folio. Elige otra.');return;}
  var orden=prev?prev.orden:(locales.reduce(function(m,x){return Math.max(m,x.orden||0);},0)+1);
  var d=Object.assign({},prev||{},{id:prev?prev.id:uid('l-'),nombre:nombre,codigo:cod,orden:orden,direccion:$('#l-dir').value.trim(),telefono:$('#l-tel').value.trim(),horario:$('#l-hor').value.trim()});
  upsert(locales,d);
  lstore.save(d).then(function(){toast(prev?'Sucursal actualizada':'Sucursal creada');}).catch(function(){toast('No se pudo guardar la sucursal');});
  renderLocalSel();renderCabecera();renderTodo();abrirAdmin();
}
function abrirUserForm(id){
  modo='userform';selId=id||null;
  var u=id?findUser(id):null;u=u||{};
  var ls=localesOrd().map(function(l){return '<option value="'+esc(l.id)+'"'+(l.id===u.localId?' selected':'')+'>'+esc(l.nombre)+'</option>';}).join('');
  $('#sheet').innerHTML='<div class="sheet-head"><div><h2 id="panelTitulo">'+(id?'Editar usuario':'Nuevo usuario')+'</h2></div><button type="button" class="btn small" data-action="user-cancel">Cancelar</button></div>'+
    '<form id="uform" novalidate autocomplete="off"><div class="grid2">'+
    campo('u-nombre','Nombre',u.nombre||'',{req:1,full:1,ph:'Ej. María López'})+
    '<div class="campo"><label for="u-cod">Usuario <span class="req">*</span></label><input id="u-cod" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="20" value="'+esc(u.codigo||'')+'" placeholder="Ej. maria"><span class="hint">Con este usuario y su contraseña entra a trabajar. Debe ser único.</span></div>'+
    '<div class="campo"><label for="u-rol">Rol</label><select id="u-rol"><option value="cajero"'+(u.rol!=='admin'&&u.rol!=='tecnico'?' selected':'')+'>Cajero</option><option value="tecnico"'+(u.rol==='tecnico'?' selected':'')+'>Técnico</option><option value="admin"'+(u.rol==='admin'?' selected':'')+'>Administrador</option></select></div>'+
    '<div class="campo full" id="u-com-box"'+(u.rol==='tecnico'?'':' hidden')+'><label for="u-com">Comisión del técnico (% de la utilidad)</label><input id="u-com" type="number" inputmode="decimal" min="0" max="100" step="any" value="'+esc(u.comision!=null&&u.comision!==''?u.comision:30)+'"><span class="hint">Trabaja en las 3 sucursales: le llegan los equipos de Taniperla, Santa Elena y Crucero. Se le paga este porcentaje de la utilidad de cada reparación (cobro − refacción).</span></div>'+
    '<div class="campo" id="u-local-box"'+((u.rol==='admin'||u.rol==='tecnico')?' hidden':'')+'><label for="u-local">Local del cajero</label><select id="u-local">'+ls+'</select></div>'+
    '<div class="campo full"><label for="u-pin">Contraseña (mínimo 4 caracteres)'+(id?'':' <span class="req">*</span>')+'</label><input id="u-pin" type="password" maxlength="20" autocomplete="new-password" placeholder="'+(id?'Déjalo vacío para no cambiarlo':'')+'"><span class="hint">Cada persona debe usar su propia contraseña y no compartirla.</span></div>'+
    '</div><p class="err" id="uError" role="alert" hidden></p>'+
    '<div class="form-actions"><button type="submit" class="btn primary big">'+(id?'Guardar cambios':'Crear usuario')+'</button><button type="button" class="btn ghost big" data-action="user-cancel">Cancelar</button></div></form>';
  $('#sheet').scrollTop=0;
  setTimeout(function(){var c=$('#u-nombre');if(c)c.focus();},50);
}
function guardarUser(){
  var er=$('#uError');function fallo(m){er.hidden=false;er.textContent=m;}
  var nombre=$('#u-nombre').value.trim(),rol=$('#u-rol').value,pin=$('#u-pin').value.trim();
  var prev=selId?findUser(selId):null;
  if(!nombre){fallo('Falta el nombre.');return;}
  var cod=normCod($('#u-cod').value);
  if(cod.length<2){fallo('El usuario debe tener al menos 2 letras o números.');return;}
  if(usuarios.some(function(x){return x.id!==selId&&normCod(x.codigo)===cod;})){fallo('Ese usuario ya lo usa otra persona. Elige otro.');return;}
  var localId=rol==='admin'?'admin':(rol==='tecnico'?'todas':$('#u-local').value);
  if(rol==='cajero'&&!findLocal(localId)){fallo('Elige el local del cajero.');return;}
  if((!prev||pin)&&!pinOk(pin)){fallo('La contraseña debe tener al menos 4 caracteres.');return;}
  if(prev&&prev.rol==='admin'&&rol!=='admin'&&usuarios.filter(function(u){return u.rol==='admin'&&u.activo!==false;}).length<2){fallo('Debe quedar al menos un administrador.');return;}
  var id=prev?prev.id:uid('u-');
  var listo=function(h){
    var d=Object.assign({},prev||{creado:new Date().toISOString(),activo:true},{id:id,nombre:nombre,codigo:cod,rol:rol,localId:localId});
    if(rol==='tecnico'){var cm=parseFloat($('#u-com').value);d.comision=(isNaN(cm)||cm<0||cm>100)?30:cm;}else delete d.comision;
    if(h)d.pinHash=h;
    if(sesion&&sesion.id===id&&rol!=='admin'){fallo('No puedes quitarte a ti mismo el rol de administrador.');return;}
    upsert(usuarios,d);
    ustore.save(d).then(function(){toast(prev?'Usuario actualizado':'Usuario creado');}).catch(function(){toast('No se pudo guardar el usuario');});
    abrirAdmin();
  };
  if(pin)pinHash(id,pin).then(listo);else listo(null);
}
function alternarUser(id){
  var u=findUser(id);if(!u||(sesion&&u.id===sesion.id))return;
  if(u.rol==='admin'&&u.activo!==false&&usuarios.filter(function(x){return x.rol==='admin'&&x.activo!==false;}).length<2){toast('Debe quedar al menos un administrador');return;}
  var n=Object.assign({},u,{activo:u.activo===false});upsert(usuarios,n);renderAdmin();
  ustore.save(n).then(function(){toast(n.activo?'Usuario activado':'Usuario desactivado');}).catch(function(){toast('No se pudo guardar');});
}
function eliminarUser(id){
  var u=findUser(id);userDel=null;
  if(!u||(sesion&&u.id===sesion.id))return;
  if(u.rol==='admin'&&usuarios.filter(function(x){return x.rol==='admin'&&x.activo!==false;}).length<2){toast('Debe quedar al menos un administrador');renderAdmin();return;}
  usuarios=usuarios.filter(function(x){return x.id!==id;});renderAdmin();
  ustore.remove(id).then(function(){toast('Usuario eliminado');}).catch(function(){toast('No se pudo eliminar');});
}
document.addEventListener('submit',function(ev){
  var id=ev.target.id;
  if(id==='lgForm'){ev.preventDefault();intentarLogin();}
  else if(id==='setupForm'){ev.preventDefault();enviarSetup();}
  else if(id==='sbForm'){ev.preventDefault();enviarAccesoTaller();}
  else if(id==='ghForm'){ev.preventDefault();enviarConectar();}
  else if(id==='passform'){ev.preventDefault();guardarMiPass();}
  else if(id==='olvideForm'){ev.preventDefault();enviarOlvide();}
  else if(id==='ownerForm'){ev.preventDefault();enviarOwner();}
  else if(id==='uform'){ev.preventDefault();guardarUser();}
  else if(id==='lform'){ev.preventDefault();guardarLoc();}
});
document.addEventListener('change',function(ev){
  var id=ev.target.id;
  if(id==='selLocal'){localFiltro=ev.target.value;renderTodo();}
  else if(id==='u-rol'){var ulb=$('#u-local-box');if(ulb)ulb.hidden=ev.target.value!=='cajero';var uc=$('#u-com-box');if(uc)uc.hidden=ev.target.value!=='tecnico';}
  else if(id==='np-cat'||id==='dpz-cat'){var pp=$(id==='np-cat'?'#np-prov':'#dpz-prov');if(pp)pp.value=provDeCat(ev.target.value);}
  else if(/^pzmap-\d+$/.test(id)){var cat=CATS[+id.split('-')[1]],cf=Object.assign({},pzCfg());cf.mapa=Object.assign({},cf.mapa||{});cf.mapa[cat]=ev.target.value;guardarPz(cf);toast('Proveedor de «'+cat+'» guardado');}
  else if(/^pzp-/.test(id)){var lz=lineasPz().filter(function(x){return x.id===id.slice(4);})[0];if(lz){guardarPz(Object.assign({},lz,{proveedorId:ev.target.value}));renderPiezas();}}
  else if(id==='tec-sel'){tecSel=ev.target.value;renderTecnico();}
  else if(id==='det-tec'){var ed=find(selId);if(ed&&esAdmin()){var tu=findUser(ev.target.value),nn=Object.assign({},ed);if(tu)asignarTec(nn,tu);else{nn.tecnicoId='';nn.tecnicoNombre='';nn.tecnicoPct='';}guardar(nn).then(function(){toast(tu?'Técnico asignado':'Técnico quitado');}).catch(function(){});}}
  else if(ev.target.hasAttribute&&ev.target.hasAttribute('data-tecref')){var er=find(ev.target.getAttribute('data-tecref'));if(er){var vr=parseFloat(ev.target.value);guardar(Object.assign({},er,{costoRefaccion:isNaN(vr)||vr<0?0:vr})).then(function(){toast('Refacción guardada');}).catch(function(){});}}
});

/* ---------- arranque ---------- */
function arrancar(){
  store.subscribe(function(lista){
    equipos=lista;cargando=false;errorCarga='';clearTimeout(loadT);renderTodo();
  },function(e){
    cargando=false;clearTimeout(loadT);
    errorCarga=(e&&e.code==='revoked')?'Se perdió el acceso a los datos. Vuelve a abrir el programa.':'Revisa tu conexión e inténtalo de nuevo.';
    renderTodo();
  });
  pstore.subscribe(function(lista){
    provs=lista;
    if(modo==='prov')renderProvs();
    else if(modo==='detalle')renderDetalle();
  },function(){});
  lstore.subscribe(function(l){locales=l;locListo=true;evaluarAcceso();},function(){});
  ustore.subscribe(function(l){usuarios=l;usrListo=true;evaluarAcceso();},function(){});
  cstore.subscribe(function(l){config=l;cfgListo=true;lgKey='';if(modo==='admin')renderAdmin();else renderLogin();},function(){});
  pzstore.subscribe(function(l){piezas=l;if(vista==='ped')renderPiezas();else if(modo==='detalle')renderDetalle();},function(){});
  pdstore.subscribe(function(l){pedidos=l;if(vista==='ped')renderPiezas();},function(){});
  renderAviso();renderPie();renderTodo();
  loadT=setTimeout(function(){
    if(cargando){errorCarga='Tarda más de lo normal en responder. Revisa tu conexión.';renderLista();}
    if(!locListo||!usrListo){lgFalla=true;lgKey='';renderLogin();}
  },10000);
}
function iniciar(){
  $('#logoImg').src=LOGO;
  document.body.insertAdjacentHTML('afterbegin','<div class="galaxia" aria-hidden="true"><div class="estrellas e1"></div><div class="estrellas e2"></div></div>');
  var sd=$('#side');if(sd)sd.insertAdjacentHTML('afterbegin','<div class="galaxia" aria-hidden="true"><div class="estrellas e1"></div></div>');
  renderLogin();
  setInterval(tickLogin,1000);
  var hayClaude=window.claude&&typeof window.claude.use==='function';
  var pDb=hayClaude?window.claude.use('db').catch(function(){return null;}):Promise.resolve(null);
  var pDl=hayClaude?window.claude.use('downloads').catch(function(){return null;}):Promise.resolve(null);
  var espera=new Promise(function(r){setTimeout(function(){r(null);},8000);});
  Promise.race([pDb,espera]).then(function(db){
    if(!db&&SB_URL&&SB_KEY){
      if(sbSes()){iniciarConSb();return;}
      var ml=false;try{ml=localStorage.getItem('gsm_modo_local')==='1';}catch(e){}
      if(!ml){mostrarAccesoTaller();return;}
    } else if(!db){
      try{var hm=/^#c=(.+)$/.exec(location.hash);if(hm){var hc=ghDeCodigo(decodeURIComponent(hm[1]));if(hc)localStorage.setItem(GHK,JSON.stringify(hc));history.replaceState(null,'',location.pathname+location.search);}}catch(e){}
      var gc=ghCfg();
      if(gc){iniciarConGh(gc);return;}
      var modoLocal=false;try{modoLocal=localStorage.getItem('gsm_modo_local')==='1';}catch(e){}
      if(!modoLocal){mostrarConectar();return;}
    }
    store=db?dbStore(db,'equipos'):localStore('gsm_equipos_v1');
    pstore=db?dbStore(db,'proveedores'):localStore('gsm_proveedores_v1');
    lstore=db?dbStore(db,'locales'):localStore('gsm_locales_v1');
    ustore=db?dbStore(db,'usuarios'):localStore('gsm_usuarios_v1');
    cstore=db?dbStore(db,'config'):localStore('gsm_config_v1');
    pzstore=db?dbStore(db,'piezas'):localStore('gsm_piezas_v1');
    pdstore=db?dbStore(db,'pedidos'):localStore('gsm_pedidos_v1');
    arrancar();
  });
  pDl.then(function(d){descargas=d||null;renderAviso();if(modo==='detalle')renderDetalle();});
}
iniciar();
})();
</script>
